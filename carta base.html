<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta - Sushi Margus</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#1b1b1b;
    color:white;
    text-align:center;
}

header{
    background:linear-gradient(90deg,#d32f2f,#ff9800);
    padding:25px;
}

h1{
    margin:0;
}

.menu{
    max-width:800px;
    margin:30px auto;
}

.producto{
    width:350px;
    margin:20px auto;
    padding:20px;
    background:white;
    color:black;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.producto h2{
    color:#d32f2f;
}

a{
    display:inline-block;
    margin:30px;
    padding:12px 25px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

a:hover{
    background:#e68900;
}
.producto img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
}

.producto{
    transition:0.3s;
}

.producto:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 25px rgba(0,0,0,.5);
}
.contenedor-promos{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.promo{
    background:white;
    color:black;
    width:200px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.promo h3{
    color:#d32f2f;
}

button{
    background:#ff9800;
    color:white;
    border:none;               
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
.tarjeta {
    width: 300px;
    margin: 30px auto;
    padding: 20px;
    text-align: center;
    background-color: white;
    border-radius: 15px;
}

button {
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
}
.producto img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;

}

.boton-pedir{
    display:inline-block;
    background:#d35400;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
}

.boton-pedir:hover{
    background:#ff9800;
    transform:scale(1.05);
}
.categoria{
    width:100%;
    margin:40px auto;
}

.categoria h2{
    color:#ff9800;
    font-size:28px;
}

.roll:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 25px rgba(0,0,0,.4);

}
    
 .roll{
    width:280px;
    background:white;
    color:black;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
    transition:0.3s;
    margin:10px;

    text-align:center;
    overflow:hidden;
}

.roll img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}

.roll h3{
    color:#d32f2f;
}

.precio{
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}
.categoria-titulo{
    background:white;
    color:black;
    width:320px;
    margin:30px auto;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
    transition:0.3s;
    cursor:pointer;
}
.categoria-titulo:hover{
    background:#fff8e1;
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(0,0,0,.5);
}
.categoria-titulo h2{
    color:#d35400;

}

.oculto{
    display:none;
}
.menu{
    max-width:100%;
    margin:30px auto;
}

.contenedor-rolls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:40px;
    width:100%;

}
</style>
</head>

<body>
<script>

function mostrarCarta(){

    let inicio = document.getElementById("inicio-carta");
    let carta = document.getElementById("carta");
    let nori = document.getElementById("nori");

    inicio.classList.add("oculto");
    carta.classList.remove("oculto");

    nori.classList.add("oculto");

}

</script>
<header>
<h1>🍣 Carta Sushi Margus</h1>
<p>Nuestros productos favoritos</p>
</header>

<section class="menu">

<div id="inicio-carta">

    <div class="categoria-titulo">

       <img src="imagenes/sushidecarta.jpg" style="width:371px; height:371px;
            transform:translate(-26px,-26px);">

       <h2>🍣 Sushi de Carta</h2>

       <p>Descubre nuestros rolls organizados por categorías.</p>

       <button onclick="mostrarCarta()">Ver categorías</button>

       <br><br>

       <button onclick="volverPortada()">⬅ Volver al inicio</button>

    </div>

</div>



<div id="carta" class="oculto">

    <div class="contenedor-categorias">

        <div class="categoria-titulo">

            <img src="imagenes/nori.jpg" style="width:371px; height:371px;
            transform:translate(-26px,-26px);">

            <h2>🌿 Envueltos en Nori</h2>

            <p>Rolls tradicionales envueltos en alga nori.</p>

            <button onclick="mostrarNori()">Ver detalles</button>

        </div>


<div id="nori" class="oculto">

    <div class="contenedor-rolls">

        <div class="roll">
            <img src="imagenes/nori-ebi.jpg" alt="Nori Ebi">

            <h3>Nori Ebi</h3>

            <p>Camarón, queso crema y cebollín.</p>

            <span class="precio">$5.990</span>
        </div>

    </div>

</div>


     <button onclick="volverInicio()">⬅ Volver al inicio</button>

</div>

     

</section>


<script>


function mostrarNori(){

    let nori = document.getElementById("nori");

    nori.classList.toggle("oculto");

}


function volverInicio(){

    document.getElementById("carta").classList.add("oculto");
    document.getElementById("inicio-carta").classList.remove("oculto");

    document.getElementById("nori").classList.add("oculto");


}
function volverPortada(){

    window.location.href = "index.html";

}
</script>


</body>
