<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sushi Margus</title>

    <style>

/* =========================
   ESTILO GENERAL
========================= */

body{
    background:#000000;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
}


/* =========================
   PORTADA
========================= */

header{

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.7)
        ),
        url("portada.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    padding:50px 30px 80px;

    min-height:350px;

    box-sizing:border-box;

    border-bottom:3px solid #f5c542;
}


/* =========================
   LOGO
========================= */

header h1{
    margin:0;
}

header h1 img{
    max-width:90%;
    height:auto;
}


/* =========================
   DESCRIPCIÓN
========================= */

.descripcion-portada{

    font-size:18px;

    margin-top:10px;
    margin-bottom:25px;

    color:white;

    text-shadow:0 2px 5px rgba(0,0,0,.8);
}


/* =========================
   BOTONES
========================= */

.boton{

    display:inline-block;

    background:linear-gradient(135deg,#d90000,#8b0000);

    color:white;

    text-decoration:none;

    padding:14px 30px;

    margin:5px;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

    border:1px solid #f5c542;

    box-shadow:0 5px 15px rgba(0,0,0,.5);

    transition:.3s;
}


/* =========================
   EFECTO AL PASAR EL MOUSE
========================= */

.boton:hover{

    background:linear-gradient(
        135deg,
        #ffcc00,
        #d90000
    );

    color:#111;

    transform:scale(1.05);
}


/* =========================
   BOTÓN VER CARTA
========================= */

.boton-carta{

    display:block;

    width:80%;

    max-width:300px;

    margin:10px auto;

    box-sizing:border-box;
}


/* ==========================================
   BOTONES REDES Y CONTACTO
========================================== */

.botones-portada{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;

    width:100%;
    margin:25px auto;
}


/* BOTÓN */

.botones-portada .boton{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    min-width:150px;

    padding:11px 18px;

    background:#000;
    color:white;

    border:2px solid #d32f2f;
    border-radius:12px;

    text-decoration:none;

    font-size:16px;
    font-weight:bold;

    box-shadow:0 0 8px rgba(211,47,47,0.35);

    transition:all 0.3s ease;
}


/* LOGOS */

.logo-red{
    width:25px;
    height:25px;

    flex-shrink:0;
}


/* EFECTO AL PASAR EL MOUSE */

.botones-portada .boton:hover{
    color:#f5c542;

    border-color:#f5c542;

    transform:translateY(-2px);

    box-shadow:
        0 0 10px rgba(245,197,66,0.7),
        0 0 20px rgba(211,47,47,0.4);
}


/* EFECTO AL PRESIONAR */

.botones-portada .boton:active{
    transform:scale(0.96);
}


/* CELULAR */

@media (max-width:600px){

    .botones-portada{
        gap:10px;
        padding:0 10px;
        box-sizing:border-box;
    }

    .botones-portada .boton{
        min-width:140px;
        padding:10px 14px;
        font-size:15px;
    }

    .logo-red{
        width:23px;
        height:23px;
    }

}


/* =========================
   BOTÓN PROMOCIONES
========================= */

.boton-promociones{

    display:block;

    width:80%;

    max-width:300px;

    margin:10px auto 30px;

    box-sizing:border-box;

background:linear-gradient(135deg,#d90000,#8b0000);
    color:#ffffff;

    border:1px solid #f5c542;

    box-shadow:
        0 5px 18px rgba(245,197,66,.25);
}


.boton-promociones:hover{

    background:linear-gradient(
        135deg,
        #ffcc00,
        #d90000
    );

    color:white;

    transform:scale(1.05);
}


/* =========================
   PIE DE PÁGINA
========================= */

footer{

    background:#050505;

    padding:30px 20px 40px;

    margin-top:0;

    border-top:2px solid #d32f2f;

    box-shadow:0 -5px 20px rgba(0,0,0,.5);
}


/* =========================
   INFORMACIÓN
========================= */

footer h2{

    color:#f5c542;

    font-size:28px;

    margin-top:10px;
}


footer p{

    font-size:16px;

    color:#eee;

    line-height:1.5;
}


/* =========================
   COPYRIGHT
========================= */

footer .copyright{

    margin-top:30px;

    font-size:14px;

    color:#777;
}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    header{

        padding:40px 15px 60px;

        min-height:320px;

    }


    header h1 img{

        width:300px;

        max-width:90%;

    }


    .descripcion-portada{

        font-size:15px;

        line-height:1.5;

        margin-top:15px;

        margin-bottom:20px;

    }


    /* =====================
       VER CARTA
    ===================== */

    .boton-carta{

        width:80%;

        max-width:300px;

        padding:13px 20px;

        margin:10px auto;

    }


    /* =====================
       REDES Y CONTACTO
    ===================== */

    .botones-portada{

        display:flex;

        justify-content:center;

        align-items:center;

        flex-wrap:wrap;

        gap:8px;

        padding:0 5px;

        margin-bottom:15px;

    }


    .botones-portada .boton{

        display:inline-block;

        width:auto;

        padding:11px 13px;

        font-size:14px;

        margin:0;

    }


    /* =====================
       PROMOCIONES
    ===================== */

    .boton-promociones{

        width:80%;

        max-width:300px;

        padding:13px 20px;

        margin:10px auto 25px;

    }


    /* =====================
       FOOTER
    ===================== */

    footer{

        padding:25px 15px 35px;

    }


    footer h2{

        font-size:24px;

    }


    footer p{

        font-size:15px;

        line-height:1.5;

    }

}

    </style>

</head>
